server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/sbpdb_prod
    username: ${POSTGRES_USER:system}
    password: ${POSTGRES_PASSWORD:passw0rd}
    hikari:
      auto-commit: true
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  sql:
    init:
      mode: never

app:
  url:
    frontend-base: ${APP_FRONTEND_BASE:http://localhost:8080}

mail:
  enabled: true
  from: ${MAIL_FROM}
  host: ${MAIL_HOST}
  port: ${MAIL_PORT}
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}

springdoc:
  packages-to-scan: com.sandbrick.sbp

logging:
  level:
    org.flywaydb.core: INFO
