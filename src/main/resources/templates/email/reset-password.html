<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
      <html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
      <head>
      <meta charset="UTF-8">
      <title>Reset Your Password</title>
  <style>
    body { font-family: Arial, sans-serif; color: #333; padding: 20px; }
    .container {
        max-width: 600px;
        margin: auto;
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 40px;
    }
    .logo {
        font-size: 36px;
        font-weight: bold;
        color: #E07A5F;
        margin-bottom: 20px;
    }
    a.button {
        display: inline-block;
        padding: 12px 24px;
        background-color: #3D405B;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
        margin-top: 20px;
    }
    .footer {
        margin-top: 30px;
        font-size: 13px;
        color: #999;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo">🧱 Sandbrick</div>
  <p>Hello <strong th:text="${username}">User</strong>,</p>
  <p>You requested a password reset. Click the button below to proceed:</p>
  <p><a th:href="${resetUrl}" class="button">Reset Password</a></p>
  <p>If you didn't request this, you can ignore this email.</p>

  <div class="footer">
    — The Sandbrick Team
  </div>
</div>
</body>
</html>
</title>
</head>
<body>

</body>
</html>
