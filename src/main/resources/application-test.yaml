spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sbpdb_test}
    username: ${POSTGRES_USER:system}
    password: ${POSTGRES_PASSWORD:passw0rd}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false

app:
  url:
    frontend-base: ${APP_FRONTEND_BASE:http://localhost:8082}

mail:
  smtp:
    enabled: false
